# =============================================================================
# 7.2.11-stable.conf — Kernel 7.2.11 (série stable maintenue sur kernel.org)
# BOOKWORM Sky1 Kernel Builder
# =============================================================================

KERNEL_VERSION="7.2"
KERNEL_FULL_VERSION="7.2.11"
KERNEL_TARBALL="linux-7.2.11.tar.xz"
KERNEL_URL="https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-7.2.11.tar.xz"

SKY1_TRACK="stable"
SKY1_PATCHES_DIR="patches-next"
# Série Sky1 portée sur 7.2 par BOOKWORM (patches-next de linux-sky1 adaptés), dans ce dépôt
SKY1_PATCHES_LOCAL="patches/sky1-7.2"
SKY1_CONFIG="config/config.sky1-next"
# Copie de config/config.sky1-next de linux-sky1 (ae7763c), dans ce dépôt : linux-sky1 n'est plus nécessaire
SKY1_CONFIG_LOCAL="config/sky1/config.sky1-next"
SKY1_REPO="https://github.com/Sky1-Linux/linux-sky1.git"

KERNEL_LOCALVERSION="-sky1-custom"
KERNEL_BUILD_NAME="${KERNEL_FULL_VERSION}${KERNEL_LOCALVERSION}"

FORCE_BUILTIN="
ARCH_CIX
PCI_SKY1
PINCTRL_SKY1_BASE
PINCTRL_SKY1
RESET_SKY1
CLK_SKY1_AUDSS
HWSPINLOCK_SKY1
CIX_MBOX
PHY_CIX_PCIE
PHY_CIX_USB2
PHY_CIX_USB3
PHY_CIX_USBDP
NVME_CORE
BLK_DEV_NVME
TYPEC
GPIO_CADENCE
I2C_CADENCE
USB_CDNS3_HOST
USB_CDNS3_GADGET
ARM_SCMI_POWER_DOMAIN
ARM_SCMI_PERF_DOMAIN
RESET_SCMI
REGULATOR_FIXED_VOLTAGE
REGULATOR_GPIO
"

# DRM_KOMEDA : depuis 7.2, komeda (amont) reconnaît aussi "armchina,linlon-d6" et se dispute
# les contrôleurs d'affichage avec linlon_dp (pilote Sky1). Désactivé pour éviter la course.
FORCE_DISABLED="
PCIE_CADENCE_PLAT
PCIE_CADENCE_PLAT_HOST
PCIE_CADENCE_PLAT_EP
DRM_KOMEDA
CRYPTO_ECRDSA
"

FIXES="
pci-sky1-link-down-guard
dts-add-cpu-thermal-zones
dts-disable-unused-dpu
npu-sky1-pm-runtime-fix
"

PATCHES_EXTRA="
9001-trilin-dptx-propagate-of_node-to-audio-pdev
9002-fix-amvx-ubsan-flexible-array
9003-fix-amvx-vb2-lock
9004-cpufreq-scmi-boost-param-from-init
9005-usb-cdns3-guard-null-role-in-cdns_role_stop
9007-trilin-dp-recover-stale-crtc
9008-usb-cdns3-guard-null-hcd-in-cdns_host_resume
9009-trilin-dp-softdep-hdmi-codec
"

# Horloge et préemption de la config Gentoo (bisection du 2026-10-17, docs/notes-materiel.md §14) :
# glmark2 +17 % (2140 → 2508) et bureau plus fluide, sans toucher à la sécurité.
# UBSAN coupé : outil de détection de bugs, sans coût mesurable ni rôle de protection en production.
# Les autres durcissements Ubuntu sont gardés (ISO publique : sûr par défaut ; ~5 % au total).
CONFIG_OVERRIDES="
# Horloge noyau : 250 Hz, tick coupé seulement au repos
HZ_1000=n
HZ_250=y
HZ=250
NO_HZ_FULL=n
NO_HZ_IDLE=y
VIRT_CPU_ACCOUNTING_GEN=n
TICK_CPU_ACCOUNTING=y
IRQ_TIME_ACCOUNTING=y
# Préemption complète classique (Ubuntu : dynamique, mode lazy)
PREEMPT_LAZY=n
PREEMPT_DYNAMIC=n
PREEMPT=y
SCHED_CORE=n
# Instrumentation
UBSAN=n
"

STATUS="stable"
TESTED="yes"
TESTED_BY="kennytech73"
TESTED_DATE="2026-10-17"
NOTES="Série Sky1 portée sur Linux 7.2 (patches/sky1-7.2 : 43 patches Sky1-Linux + 0044/0045 BOOKWORM). Track par défaut, validé sur Orange Pi 6 Plus le 2026-10-16. 7.2 : USB Cadence unifié (cdns.ko, USB_CDNSP_GADGET remplacé par USB_CDNS3_GADGET/HOST), panthor par blocs. 9006 inutile (PS185HDM en amont). 2026-10-17 : horloge/préemption Gentoo (HZ 250, PREEMPT) et UBSAN coupé, validé (glmark2 2517/2529 contre 2125/2155)."
