# =============================================================================
# ubuntu-26.04.1.conf — Distribution de base de l'ISO : Ubuntu 26.04.1 LTS (iso/build-iso.sh --distro)
# BOOKWORM Sky1 Kernel Builder
#
# Même structure que la 26.10 (inspectée le 2026-10-19) : couches minimal / standard / live,
# initrd casper par initramfs-tools, dracut pour le système installé, même entrée GRUB.
# Versions : Mesa 26.0, GTK 4.22, GNOME 50, WirePlumber 0.5.13, PipeWire 1.6.2, systemd 259 :
# compatibles avec les réglages du paquet bookworm-sky1-settings. Firmware Mali identique.
# =============================================================================

DISTRO_NAME="Ubuntu 26.04.1 LTS"
# Prise en charge par Ubuntu (le noyau Sky1, lui, vient toujours de ce projet)
DISTRO_SUPPORT="LTS, 5 ans (jusqu'en avril 2031)"

# ISO officielle : téléchargée si absente, puis vérifiée (liste signée + empreinte figée ici)
ISO_FILE="ubuntu-26.04.1-desktop-arm64.iso"
ISO_URL="https://cdimage.ubuntu.com/ubuntu/releases/26.04.1/release"
ISO_SHA256="c54d196489d3c867975fb3bbb72ca52ec2e137456e305481f81096304e4d2517"

# ISO produite : <OUT_PREFIX>-<date>.iso ; étiquette du volume (32 caractères au plus)
OUT_PREFIX="ubuntu-26.04.1-bookworm-sky1-orangepi6plus-arm64"
VOLUME_ID="Ubuntu 26.04.1 Sky1 arm64"

# Entrée GRUB de l'ISO officielle devant laquelle l'entrée Sky1 est insérée
GRUB_ANCHOR='menuentry "Try or Install Ubuntu" {'

# testing = ISO pas encore validée (live + installation) ; stable = validée
# Validée le 2026-10-22 (live + installation). Limitation : Showtime saccade (VLC fluide)
STATUS="stable"
