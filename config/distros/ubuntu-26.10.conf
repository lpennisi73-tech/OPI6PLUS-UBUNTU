# =============================================================================
# ubuntu-26.10.conf — Distribution de base de l'ISO : Ubuntu 26.10 (iso/build-iso.sh --distro)
# BOOKWORM Sky1 Kernel Builder
#
# L'ISO officielle est remasterisée sans être modifiée : noyau Sky1, réglages et firmwares
# VPU ajoutés à ses couches. Ce fichier ne décrit que ce qui change d'une version à l'autre.
# =============================================================================

DISTRO_NAME="Ubuntu 26.10"
# Prise en charge par Ubuntu (le noyau Sky1, lui, vient toujours de ce projet)
DISTRO_SUPPORT="9 mois (jusqu'en juillet 2027)"

# ISO officielle : téléchargée si absente, puis vérifiée (liste signée + empreinte figée ici)
ISO_FILE="ubuntu-26.10-desktop-arm64.iso"
ISO_URL="https://cdimage.ubuntu.com/ubuntu/releases/26.10/release"
ISO_SHA256="9242a38c47eb53a5beb153c249d4843e4366f8955e9b972663e4ab7989311e9f"

# ISO produite : <OUT_PREFIX>-<date>.iso ; étiquette du volume (32 caractères au plus)
OUT_PREFIX="ubuntu-26.10-bookworm-sky1-orangepi6plus-arm64"
VOLUME_ID="Ubuntu 26.10 Sky1 arm64"

# Entrée GRUB de l'ISO officielle devant laquelle l'entrée Sky1 est insérée
GRUB_ANCHOR='menuentry "Try or Install Ubuntu" {'

# testing = ISO pas encore validée (live + installation) ; stable = validée
STATUS="stable"
