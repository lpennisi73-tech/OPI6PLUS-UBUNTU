# BOOKWORM Sky1 — liste de profils ACP de la carte cix_sky1 (DP + HDMI, alsa_card.platform-sound)
# Le profil générique « Sortie Stéréo » (stereo-fallback de default.conf) annonçait une
# « Sortie analogique » qui n'existe pas sur cette carte : la choisir dans GNOME faisait
# quitter le profil Pro Audio et disparaître les sorties DP et HDMI. Sans aucun mapping,
# il ne reste que « Éteint » et « Pro Audio » (pro-output-0 = DP, pro-output-1 = HDMI).
# La vraie sortie analogique (prise ligne, ALC269) est sur l'autre carte (HDA).
# Choisie par config/wireplumber/51-sky1-hdmi-profile.conf (device.profile-set).
[General]
auto-profiles = no
