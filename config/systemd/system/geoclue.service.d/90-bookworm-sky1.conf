# geoclue sur Orange Pi 6 Plus (paquet bookworm-sky1-settings).
# Au démarrage, geoclue initialise dans des threads différents le système de fichiers de GIO
# (g_vfs_get_default) et le résolveur de proxy (g_proxy_resolver_get_default). Le module
# libproxy de glib-networking, chargé sous le verrou des modules GIO, appelle lui-même
# g_vfs_get_default : interblocage (glib 2.90, libproxy 0.5), le nom D-Bus n'est jamais
# pris et le service échoue au bout de 90 s (4 démarrages sur 5 sur cette carte).
# Le résolveur « dummy » de GIO évite libproxy ; geoclue, service système, n'a pas besoin
# des réglages de proxy de l'utilisateur (sa seule requête réseau : la géolocalisation Wi-Fi).
[Service]
Environment=GIO_USE_PROXY_RESOLVER=dummy
