# Noyau de secours kdump sur Orange Pi 6 Plus (paquet bookworm-sky1-settings).
# kdump-config ne prend sa valeur par défaut de KDUMP_CMDLINE_APPEND que si la variable
# n'est pas déjà définie : ce réglage s'applique donc tant que la ligne reste commentée dans
# /etc/default/kdump-tools (une valeur posée là par l'utilisateur passe devant).
# - cma=0 : sans lui, les 640 Mo de CMA du devicetree prennent presque toute la mémoire
#   réservée au noyau de secours ;
# - module_blacklist : GPU, NPU, VPU, affichage et DSP inutiles pour écrire le vidage ;
#   panthor y échoue faute de mémoire et provoque un OOM avant l'écriture.
# Les trois premiers paramètres sont ceux d'Ubuntu par défaut (la variable les remplace).
[Service]
Environment="KDUMP_CMDLINE_APPEND=reset_devices systemd.unit=kdump-tools-dump.service nr_cpus=1 cma=0 module_blacklist=panthor,armchina_npu,amvx,linlon_dp,trilin_dpsub,cix_dsp_rproc"
