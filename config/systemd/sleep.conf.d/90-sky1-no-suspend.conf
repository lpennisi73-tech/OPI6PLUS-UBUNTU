# BOOKWORM Sky1 — veille système désactivée.
# Sur Orange Pi 6 Plus (firmware CIX 1.4, noyau 7.2.11), ni « deep » ni « s2idle » ne se
# réveillent (clavier, souris, bouton d'alimentation, alarme RTC) : coupure secteur obligatoire.
# GNOME masque alors « Mettre en veille ». L'extinction des écrans (DPMS) fonctionne.
# Supprimer ce fichier quand la veille sera réparée (diagnostic prévu par console série ttyAMA2).
[Sleep]
AllowSuspend=no
AllowHybridSleep=no
AllowSuspendThenHibernate=no
