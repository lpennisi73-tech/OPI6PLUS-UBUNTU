# BOOKWORM Sky1 — clients PulseAudio (VLC, Firefox…) sur les sorties DP/HDMI.
# Les sinks DP/HDMI tournent avec un quantum forcé de 4096 (85 ms, voir
# wireplumber/52-sky1-hdmi-buffer.conf). Par défaut un client Pulse reçoit des
# requêtes de ~40 ms et un tampon de ~120 ms : chaque cycle de 85 ms vide le tampon,
# d'où un son haché (coupures puis reprise) dans VLC. On aligne les tampons Pulse
# sur ce quantum.
pulse.properties = {
    pulse.min.req     = 4096/48000
    pulse.min.quantum = 4096/48000
    pulse.min.frag    = 4096/48000
}
