# =============================================================================
# board.conf — Configuration matérielle OrangePi 6 Plus
# BOOKWORM Sky1 Kernel Builder
# =============================================================================

# Board
BOARD="orangepi-6-plus"
BOARD_NAME="Orange Pi 6 Plus"
SOC="cix-cd8180"
SOC_NAME="CIX CD8180 (Sky1)"
ARCH="arm64"

# Répertoire de build (sources kernel + linux-sky1)
BUILD_DIR="/usr/src/build/sky1-kernel"

# DTB
DTB_NAME="sky1-orangepi-6-plus.dtb"
DTB_PATH="/boot/dtb/${DTB_NAME}"

# Boot (Ubuntu : noms fixés par le paquet .deb, kver = `make kernelrelease`)
#   /boot/vmlinuz-<kver>, /boot/initrd.img-<kver>, /boot/dtb/sky1-orangepi-6-plus-<kver>.dtb

# Debug info dans le kernel : "yes" = décoder un Oops (scripts/faddr2line, gdb, crash/kdump)
# avec le vmlinux du répertoire de build ou du paquet linux-image-<kver>-dbg.
# Les modules du paquet image sont strippés (pas d'impact sur l'initramfs).
# "no" = build plus rapide, pas de paquet -dbg. BTF reste toujours désactivé.
KERNEL_DEBUG_INFO="yes"
# Paquet linux-image-<kver>-dbg (1,7 Go, ~16 min d'empaquetage en série) : "no" le saute,
# le vmlinux avec debug info reste dans l'arbre de build. Équivalent ponctuel : --no-dbg
KERNEL_DBG_PKG="yes"

# Paramètres kernel obligatoires pour ce board (entrée GRUB Sky1 : boot devicetree, pas ACPI)
# Pas de efi=noruntime (hérité de Gentoo) : sans les services runtime EFI, efibootmgr échoue et
# l'installateur Ubuntu ne peut pas poser GRUB. Testé sans le 2026-10-18 : efivars, efibootmgr, rtc-efi OK.
# Plymouth (logo au démarrage) : actif depuis le 2026-10-20 (simpledrm puis linlondp, testé). Le
# « quiet splash » vient de GRUB_CMDLINE_LINUX_DEFAULT (/etc/default/grub), comme pour 10_linux ;
# plymouth.ignore-serial-consoles : la console série ttyAMA2 ne fait pas passer Plymouth en mode texte.
KERNEL_CMDLINE="acpi=off clk_ignore_unused plymouth.ignore-serial-consoles rootwait"
KERNEL_CMDLINE="${KERNEL_CMDLINE} console=ttyAMA2,115200 console=tty0"
KERNEL_CMDLINE="${KERNEL_CMDLINE} scmi_cpufreq.boost=1"

# Modules à charger au boot (un par ligne, nom tel qu'attendu par modprobe)
# scmi-hwmon : températures SoC (hwmon scmi_sensors) ; pas chargé automatiquement sous Ubuntu
# rtc-rv8803 : RTC rx8900 (I2C) ; le DT dit "rtc,rx8900" au lieu de "epson,rx8900" → pas d'alias, pas d'autochargement
MODULES_AUTOLOAD="
scmi-cpufreq
scmi-hwmon
rtc-rv8803
"

# Options modprobe à écrire dans /etc/modprobe.d/ au moment de l'install
# Format: "module:options"
MODPROBE_OPTIONS="
scmi_cpufreq:boost=1
"

# UUID de la racine : vide = détecté par install.sh (findmnt) ; le GRUB Sky1 prend celui d'update-grub
ROOT_UUID=""

# Slots PCIe présents sur ce board (les autres sont désactivés dans le DTB)
# a010000 = X8  — NVMe SSD
# a0c0000 = X2  — RTL8126 5GbE eth0
# a0e0000 = X1_1 — RTL8126 5GbE eth1
# a070000 = X4  — VIDE → disabled
# a0d0000 = X1_0 — WiFi → disabled (non monté)
PCIE_ACTIVE="a010000 a0c0000 a0e0000"
PCIE_DISABLED="a070000 a0d0000"

# GPU
GPU="Mali-G720-Immortalis"
GPU_DRIVER="panthor"
GPU_FIRMWARE="arm/mali/arch12.8/mali_csffw.bin"

# Serial debug
SERIAL_PORT="/dev/ttyAMA2"
SERIAL_BAUD="115200"
# BOOT_MODE: ACPI (DeviceTree désactive les sensors SCMI avec BIOS 1.4)
