# BOOKWORM Sky1 — GTK4 : pas d'« offload » graphique (vidéo passée telle quelle au compositeur).
# En plein écran, GTK exporte en dmabuf le buffer de l'image vidéo pour le donner à
# gnome-shell. Ce buffer a été créé privé (réservé à un contexte GPU) et panthor refuse
# de l'exporter (EINVAL, « drmPrimeHandleToFD() failed (err=22) ») ; GTK envoie alors un
# descripteur invalide, Wayland coupe la connexion (« Error 9 ») et l'application se ferme
# (Showtime, constaté sur 7.2.11, GTK 4.24, Mesa 26.2). Sans offload, GTK recopie l'image
# dans sa fenêtre : lecture fluide en plein écran. Effectif à la prochaine session.
GDK_DISABLE=offload
