# BOOKWORM Sky1 — gnome-shell (mutter/cogl) en OpenGL ES au lieu d'OpenGL « bureau ».
# En GL bureau, cogl envoie les images dessinées par le processeur (panneau des
# notifications, menu système, icônes : BGRA) avec un format interne RGBA8 ; Mesa
# (panfrost) doit alors permuter chaque pixel sur le processeur, octet par octet,
# dans la mémoire du GPU (convert_ubyte ← _mesa_store_texsubimage ← glTexImage2D).
# Une ouverture du panneau des notifications (1508×1116) bloquait gnome-shell plusieurs
# images : la vidéo en cours saccadait (60 → 43 images/s). En GLES, le BGRA est envoyé
# tel quel, sans conversion : plus de saccade (constaté sur Mesa 26.2.4, mutter 51).
# Effectif au prochain démarrage du gestionnaire de session (reboot).
COGL_DRIVER=gles2
