# BOOKWORM Sky1 — décodeurs vidéo matériels V4L2 (VPU amvx) hors autoplug GStreamer.
# GStreamer 1.28 les classe « primary + 1 » : Showtime (lecteur GNOME) les choisit
# d'office et affiche une image verte figée, sans son (le décodage est correct ;
# c'est le passage VPU → GTK4 qui échoue). En rang NONE, les lecteurs décodent par
# le CPU (image et son parfaits) ; les pipelines explicites (gst-launch …
# v4l2h264dec …, ffmpeg) utilisent toujours le VPU. Effectif à la prochaine session.
GST_PLUGIN_FEATURE_RANK=v4l2h264dec:NONE,v4l2h265dec:NONE,v4l2av1dec:NONE,v4l2vp8dec:NONE,v4l2vp9dec:NONE,v4l2mpeg2dec:NONE,v4l2mpeg4dec:NONE,v4l2h263dec:NONE
