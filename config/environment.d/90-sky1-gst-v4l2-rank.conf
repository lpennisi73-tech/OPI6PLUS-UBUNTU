# BOOKWORM Sky1 — décodeurs vidéo matériels V4L2 (VPU amvx) hors autoplug GStreamer.
# GStreamer 1.28 les classe « primary + 1 » : les lecteurs du bureau (Showtime) les
# choisiraient d'office. L'affichage VPU → GTK4 n'est pas fiable (écran noir à la reprise
# d'une vidéo, image qui clignote avec le framebuffer en surimpression et saccades,
# docs/notes-materiel.md §13). En rang NONE, les lecteurs décodent par le CPU
# (avdec_h264… de gstreamer1.0-libav, case « codecs tiers » de l'installateur), comme
# Ubuntu d'origine : sans ce paquet, pas de H.264 dans les lecteurs GStreamer.
# Les pipelines explicites (gst-launch … v4l2h264dec …) utilisent toujours le VPU.
# Effectif au prochain démarrage du gestionnaire de session utilisateur (reboot).
GST_PLUGIN_FEATURE_RANK=v4l2h264dec:NONE,v4l2h265dec:NONE,v4l2av1dec:NONE,v4l2vp8dec:NONE,v4l2vp9dec:NONE,v4l2mpeg2dec:NONE,v4l2mpeg4dec:NONE,v4l2h263dec:NONE
