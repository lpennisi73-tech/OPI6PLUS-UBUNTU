# OrangePi 6 Plus : quantum 4096 tant que le sink DP/HDMI est actif (xruns à 1024) + noms lisibles
# Sorties DP et HDMI jamais mises en veille ni en pause : la file audio du contrôleur DP se bloque
# parfois (jusqu'au redémarrage) dans la seconde qui suit le démarrage d'un flux ; en les laissant
# tourner (silence), le flux ne démarre qu'une fois par session au lieu d'à chaque son
# (docs/notes-materiel.md, son HDMI).
monitor.alsa.rules = [
  {
    matches = [ { node.name = "alsa_output.platform-sound.pro-output-1" } ]
    actions = {
      update-props = {
        node.description    = "HDMI"
        node.nick           = "HDMI"
        node.force-quantum  = 4096
        session.suspend-timeout-seconds = 0
        node.pause-on-idle  = false
        # sortie par défaut (DP : 1500 d'origine, HDMI : 1228) tant que l'utilisateur n'en choisit pas une autre
        priority.session    = 1600
        priority.driver     = 1600
      }
    }
  }
  {
    matches = [ { node.name = "alsa_output.platform-sound.pro-output-0" } ]
    actions = {
      update-props = {
        node.description    = "DisplayPort"
        node.nick           = "DisplayPort"
        node.force-quantum  = 4096
        session.suspend-timeout-seconds = 0
        node.pause-on-idle  = false
      }
    }
  }
]
