# OrangePi 6 Plus : exposer DP + HDMI (cix_sky1) via le profil Pro Audio
device.profile.priority.rules = [
  {
    matches = [
      { device.name = "alsa_card.platform-sound" }
    ]
    actions = {
      update-props = {
        priorities = [ "pro-audio" ]
      }
    }
  }
]

# Liste de profils sans le faux « Sortie Stéréo / Sortie analogique » (voir sky1-hdmi-dp.conf)
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.platform-sound" }
    ]
    actions = {
      update-props = {
        device.profile-set = "sky1-hdmi-dp.conf"
      }
    }
  }
]
